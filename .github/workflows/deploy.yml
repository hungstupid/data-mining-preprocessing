# Jupyter Book 2 / MyST static HTML deployment.
# Enable GitHub Pages with GitHub Actions as the source before publishing.
name: Publish Jupyter Book

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install the pinned book CLI in an isolated environment
        run: |
          python -m venv .venv
          book_requirement="$(sed -n '/^jupyter-book==/p' requirements.txt)"
          test -n "$book_requirement"
          .venv/bin/python -m pip install "$book_requirement"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static HTML without private data
        run: .venv/bin/jupyter book build --html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
